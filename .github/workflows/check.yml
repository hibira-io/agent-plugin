name: check
# The checks live inline here, not in scripts/: the Claude plugin directory
# refuses plugins that ship script files unless the publisher is Verified.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      demo_url:
        description: Demo recording URL for the ChatGPT submission (optional)
        required: false
permissions:
  contents: read
jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Manifests agree on version and MCP URLs
        run: |
          node --input-type=module <<'JS'
          // Checks that every client manifest agrees on the plugin version and the MCP URL.
          import { readFileSync, existsSync } from 'node:fs';

          const MCP_URL = 'https://hibira.io/mcp';
          const LIVE_CHAT_URL = 'https://chat.hibira.io/mcp';
          const GAYA_URL = 'https://gaya.hibira.io/mcp';
          const read = (p) => JSON.parse(readFileSync(p, 'utf8'));
          const errors = [];

          const version = read('.claude-plugin/plugin.json').version;
          const versions = {
            '.claude-plugin/marketplace.json': read('.claude-plugin/marketplace.json').metadata.version,
            '.cursor-plugin/plugin.json': read('.cursor-plugin/plugin.json').version,
            '.codex-plugin/plugin.json': read('.codex-plugin/plugin.json').version,
            'gemini-extension.json': read('gemini-extension.json').version,
            'plugin.json': read('plugin.json').version,
          };
          for (const [file, v] of Object.entries(versions)) {
            if (v !== version) errors.push(`${file}: version ${v}, expected ${version}`);
          }

          const urls = {
            '.mcp.json': read('.mcp.json').mcpServers.hibira?.url,
            'mcp.json': read('mcp.json').mcpServers.hibira?.url,
            'gemini-extension.json': read('gemini-extension.json').mcpServers.hibira?.httpUrl,
          };
          for (const [file, u] of Object.entries(urls)) {
            if (u !== MCP_URL) errors.push(`${file}: MCP URL ${u}, expected ${MCP_URL}`);
          }

          const liveChat = {
            '.mcp.json': read('.mcp.json').mcpServers['hibira-live-chat']?.url,
            'mcp.json': read('mcp.json').mcpServers['hibira-live-chat']?.url,
            'gemini-extension.json': read('gemini-extension.json').mcpServers['hibira-live-chat']?.httpUrl,
          };
          for (const [file, u] of Object.entries(liveChat)) {
            if (u !== LIVE_CHAT_URL) errors.push(`${file}: Live Chat MCP URL ${u}, expected ${LIVE_CHAT_URL}`);
          }

          const gaya = {
            '.mcp.json': read('.mcp.json').mcpServers.gaya?.url,
            'mcp.json': read('mcp.json').mcpServers.gaya?.url,
            'gemini-extension.json': read('gemini-extension.json').mcpServers.gaya?.httpUrl,
          };
          for (const [file, u] of Object.entries(gaya)) {
            if (u !== GAYA_URL) errors.push(`${file}: Gaya MCP URL ${u}, expected ${GAYA_URL}`);
          }

          // The merchant ops plugin (plugins/merchant-ops) versions on its own.
          const ops = 'plugins/merchant-ops';
          const opsVersion = read(`${ops}/.claude-plugin/plugin.json`).version;
          const opsEntry = read('.claude-plugin/marketplace.json').plugins.find((p) => p.name === 'hibira-merchant-ops');
          if (!opsEntry) errors.push('marketplace.json does not list hibira-merchant-ops');
          else if (opsEntry.version !== opsVersion) errors.push(`marketplace.json hibira-merchant-ops version ${opsEntry.version}, expected ${opsVersion}`);
          const opsMcp = read(`${ops}/.mcp.json`).mcpServers;
          if (opsMcp.hibira?.url !== MCP_URL) errors.push(`${ops}/.mcp.json: MCP URL ${opsMcp.hibira?.url}, expected ${MCP_URL}`);
          if (opsMcp['hibira-live-chat']?.url !== LIVE_CHAT_URL) errors.push(`${ops}/.mcp.json: Live Chat MCP URL ${opsMcp['hibira-live-chat']?.url}, expected ${LIVE_CHAT_URL}`);

          // The approval hooks plugin (plugins/approval-hooks) versions on its own too,
          // and its manifests and hook configs must agree.
          const hooksDir = 'plugins/approval-hooks';
          const hooksVersion = read(`${hooksDir}/.claude-plugin/plugin.json`).version;
          const hooksEntry = read('.claude-plugin/marketplace.json').plugins.find((p) => p.name === 'hibira-approval-hooks');
          if (!hooksEntry) errors.push('marketplace.json does not list hibira-approval-hooks');
          else if (hooksEntry.version !== hooksVersion) errors.push(`marketplace.json hibira-approval-hooks version ${hooksEntry.version}, expected ${hooksVersion}`);
          for (const m of ['.codex-plugin', '.cursor-plugin']) {
            const v = read(`${hooksDir}/${m}/plugin.json`).version;
            if (v !== hooksVersion) errors.push(`${hooksDir}/${m}/plugin.json: version ${v}, expected ${hooksVersion}`);
          }
          if (!read('.agents/plugins/marketplace.json').plugins.some((p) => p.name === 'hibira-approval-hooks')) errors.push('.agents/plugins/marketplace.json does not list hibira-approval-hooks');
          const hookCmd = read(`${hooksDir}/hooks/hooks.json`).hooks.PreToolUse?.[0]?.hooks?.[0]?.command ?? '';
          const cursorCmd = read(`${hooksDir}/hooks/cursor.json`).hooks.beforeShellExecution?.[0]?.command ?? '';
          for (const [file, c] of [['hooks.json', hookCmd], ['cursor.json', cursorCmd]]) {
            if (!/^npx -y (--prefer-offline )?@hibira-io\/mcp-approval-gate@\S+ hook\b/.test(c)) errors.push(`${hooksDir}/hooks/${file}: unexpected command "${c}"`);
          }

          for (const p of ['assets/icon.png', '.claude-plugin/icon.png', 'plugins/merchant-ops/.claude-plugin/icon.png', 'plugins/approval-hooks/.claude-plugin/icon.png']) {
            if (!existsSync(p)) errors.push(`${p} is missing`);
          }

          if (errors.length) {
            console.error(errors.join('\n'));
            process.exit(1);
          }
          console.log(`ok: version ${version}, MCP ${MCP_URL}, ${LIVE_CHAT_URL} and ${GAYA_URL}`);
          JS
      - name: Build the ChatGPT plugin directory ZIP
        env:
          DEMO_URL: ${{ inputs.demo_url }}
        run: |
          node --input-type=module <<'JS'
          // Builds dist/hibira-chatgpt.zip for the ChatGPT plugin directory
          // (platform.openai.com/plugins). The directory takes one MCP server per
          // plugin, so the ZIP carries only `hibira` and the skills that use it.
          import { cpSync, existsSync, mkdirSync, readFileSync, readdirSync, rmSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { join } from 'node:path';

          const SERVER = 'hibira';
          // Skills for other products (Live Chat, Gaya) and their MCP servers stay out.
          const SKIP_SKILLS = new Set(['livechat-sso', 'livechat-widget', 'livechat-knowledge', 'gaya-ask-group', 'gaya-review']);
          const OUT = 'dist/hibira-chatgpt';

          const read = (p) => JSON.parse(readFileSync(p, 'utf8'));
          const manifest = read('.codex-plugin/plugin.json');
          const openai = read('openai/submission.json');
          const demo = (process.env.DEMO_URL || undefined) ?? openai.review.demo_recording_url;
          if (demo) openai.review.demo_recording_url = demo;
          else delete openai.review.demo_recording_url;

          manifest.extensions = { ...(manifest.extensions ?? {}), 'com.openai': openai };

          const errors = [];
          const i = manifest.interface;
          if (i.displayName.length > 30) errors.push('displayName is over 30 characters');
          if (i.shortDescription.length > 30) errors.push('shortDescription is over 30 characters');
          if (i.longDescription.length > 4000) errors.push('longDescription is over 4000 characters');
          for (const k of ['composerIcon', 'composerIconDark', 'logo', 'logoDark']) {
            if (!i[k] || !existsSync(i[k])) errors.push(`interface.${k} file is missing`);
          }
          if (!existsSync(openai.onboardingSkill)) errors.push(`${openai.onboardingSkill} is missing`);
          const cases = openai.review.test_cases;
          if (cases.positive.length !== 5) errors.push('need exactly 5 positive test cases');
          if (cases.negative.length !== 3) errors.push('need exactly 3 negative test cases');
          for (const [loc, t] of Object.entries(openai.publication.translations ?? {})) {
            if (t.subtitle.length > 30) errors.push(`${loc} subtitle is over 30 characters`);
          }
          const mcp = read('.mcp.json').mcpServers[SERVER];
          if (!mcp) errors.push(`.mcp.json has no ${SERVER} server`);
          if (errors.length) {
            console.error(errors.join('\n'));
            process.exit(1);
          }

          rmSync('dist', { recursive: true, force: true });
          mkdirSync(join(OUT, '.codex-plugin'), { recursive: true });
          writeFileSync(join(OUT, '.codex-plugin/plugin.json'), JSON.stringify(manifest, null, 2) + '\n');
          // hibira.io/mcp signs in with OAuth; the authorization server supports CIMD
          // and falls back to dynamic client registration, so no client ID is needed.
          const auth = { type: 'oauth', client: { mode: 'cimd' } };
          const server = { ...mcp, extensions: { 'com.openai': { auth } } };
          writeFileSync(join(OUT, '.mcp.json'), JSON.stringify({ mcpServers: { [SERVER]: server } }, null, 2) + '\n');
          cpSync('assets', join(OUT, 'assets'), { recursive: true });
          for (const s of readdirSync('skills')) {
            if (!SKIP_SKILLS.has(s)) cpSync(join('skills', s), join(OUT, 'skills', s), { recursive: true });
          }
          cpSync('LICENSE', join(OUT, 'LICENSE'));

          execFileSync('zip', ['-qrX', '../hibira-chatgpt.zip', '.'], { cwd: OUT });
          console.log(`dist/hibira-chatgpt.zip: version ${manifest.version}, server ${mcp.url}${demo ? '' : ' (no demo URL yet)'}`);
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hibira-chatgpt
          path: dist/hibira-chatgpt.zip
      - run: npx -y @anthropic-ai/claude-code plugin validate .
      - run: npx -y @anthropic-ai/claude-code plugin validate plugins/merchant-ops
      - run: npx -y @anthropic-ai/claude-code plugin validate plugins/approval-hooks
